<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700">
  <defs>
    <filter id="cloth-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".055 .09" numOctaves="3" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer>
    </filter>
    <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M1 0v7M4 0v7" stroke="#fff" stroke-opacity=".12" stroke-width=".65"/>
      <path d="M0 2h7M0 5h7" stroke="#000" stroke-opacity=".16" stroke-width=".6"/>
    </pattern>
    <radialGradient id="wear" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset=".56" stop-color="#aaa" stop-opacity=".02"/>
      <stop offset="1" stop-color="#111" stop-opacity=".12"/>
    </radialGradient>
  </defs>
  <rect width="520" height="700" fill="#808080"/>
  <rect width="520" height="700" filter="url(#cloth-grain)" opacity=".48"/>
  <rect width="520" height="700" fill="url(#weave)" opacity=".6"/>
  <rect width="520" height="700" fill="url(#wear)"/>
</svg>
