<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <defs>
    <filter id="soft-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".024 .03" numOctaves="2" seed="13"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues=".025 .22"/></feComponentTransfer>
    </filter>
    <filter id="fibres" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".62 .78" numOctaves="2" seed="29"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues=".01 .16"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1100" filter="url(#soft-grain)" opacity=".35"/>
  <rect width="800" height="1100" filter="url(#fibres)" opacity=".25"/>
</svg>
