<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700">
  <defs>
    <filter id="leather-grain" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .052" numOctaves="4" seed="7" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feComponentTransfer><feFuncA type="table" tableValues=".04 .4"/></feComponentTransfer>
      <feDiffuseLighting surfaceScale="1.1" diffuseConstant=".8" lighting-color="#aaa">
        <feDistantLight azimuth="226" elevation="48"/>
      </feDiffuseLighting>
    </filter>
    <filter id="pores" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".24 .31" numOctaves="2" seed="31"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <linearGradient id="patina" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".48" stop-color="#888" stop-opacity=".015"/>
      <stop offset="1" stop-color="#111" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="520" height="700" fill="#888"/>
  <rect width="520" height="700" filter="url(#leather-grain)" opacity=".48"/>
  <rect width="520" height="700" filter="url(#pores)" opacity=".38"/>
  <rect width="520" height="700" fill="url(#patina)"/>
</svg>
